  <rect x="7" y="12" width="8" height="3" fill="#FFF5EC"/>

  <rect x="2" y="3" width="3" height="4" fill="#33002D"/>
  <rect x="5" y="4" width="8" height="2" fill="#33002D"/>
  <rect x="11" y="6" width="2" height="2" fill="#33002D"/>
  <rect x="9" y="8" width="6" height="1" fill="#33002D"/>
  <rect x="10" y="9" width="4" height="1" fill="#33002D"/>
  <rect x="11" y="10" width="2" height="1" fill="#33002D"/>
</svg>
